[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versifai"
version = "0.1.0"
description = "Agentic AI framework for autonomous data engineering, science, and storytelling"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "VersifAI Contributors" },
]
keywords = [
    "ai",
    "agents",
    "data-engineering",
    "data-science",
    "llm",
    "claude",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    # Data
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "openpyxl>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pypdf>=4.0.0",
    # Science
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    # Databricks
    "databricks-sdk>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/versifai/versifai"
Documentation = "https://github.com/versifai/versifai#readme"
Repository = "https://github.com/versifai/versifai"
Issues = "https://github.com/versifai/versifai/issues"
Changelog = "https://github.com/versifai/versifai/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/versifai"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator
    "SIM105", # use contextlib.suppress (preference, not a bug)
    "B905",   # zip() without strict= (adding strict can break runtime)
    "TC001",  # move application import into TYPE_CHECKING block
    "TC002",  # move third-party import into TYPE_CHECKING block
    "TC003",  # move stdlib import into TYPE_CHECKING block
]

[tool.ruff.lint.per-file-ignores]
# Data science code conventionally uses uppercase X, X_train, etc.
"src/versifai/science_agents/scientist/tools/model_fitting.py" = ["N803", "N806"]
"src/versifai/science_agents/scientist/tools/statistical_analysis.py" = ["N806"]
"src/versifai/science_agents/scientist/tools/validate_statistics.py" = ["N806"]
"src/versifai/science_agents/scientist/tools/log_model.py" = ["N806"]
"src/versifai/core/tools/visualization.py" = ["N806"]
# Tests import to verify importability, not to use
"tests/**" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["versifai"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "litellm.*",
    "pyspark.*",
    "databricks.*",
    "matplotlib.*",
    "seaborn.*",
    "sklearn.*",
    "statsmodels.*",
    "scipy.*",
    "pymc.*",
    "arviz.*",
    "PIL.*",
    "bs4.*",
    "lxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require an LLM API key and make real LLM calls (deselect with '-m \"not integration\"')",
]
